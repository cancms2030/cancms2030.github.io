<div class="theme-card" data-categories="{{ delimit .Params.categories "," }}">
  <div class="theme-card-image-wrapper">
    <img src="{{ .Params.screenshot }}" alt="{{ .Title }} 截图" loading="lazy" decoding="async">
  </div>
  <div class="theme-info">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description | truncate 80 }}</p>
    <div class="theme-meta">
      <span>⭐ {{ .Params.stars }}</span>
      <span class="category">{{ index .Params.categories 0 }}</span>
    </div>
    <div class="theme-links">
      <a href="{{ .Params.demo }}" target="_blank">在线演示</a>
      <a href="{{ .Params.github }}" target="_blank">GitHub</a>
    </div>
  </div>
</div>
