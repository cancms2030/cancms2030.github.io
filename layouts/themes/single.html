{{ define "main" }}
  {{ $stars := .Params.stars | default 0 }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "{{ .Title }}",
    "description": "{{ .Description }}",
    "applicationCategory": "WebApplication",
    "operatingSystem": "All",
    "author": {
      "@type": "Person",
      "name": "{{ .Params.author | default "Hugo Community" }}"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "interactionStatistic": {
      "@type": "InteractionCounter",
      "interactionType": "https://schema.org/LikeAction",
      "userInteractionCount": {{ $stars }}
    }
  }
  </script>
  <article class="theme-detail">
    <h1>{{ .Title }}</h1>
    <img src="{{ .Params.screenshot }}" alt="{{ .Title }}" loading="lazy">

    <div class="theme-full-description">
      {{ .Content }}
    </div>

    <div class="theme-specs">
      <p>⭐ GitHub Star：{{ .Params.stars }}</p>
      <p>分类：{{ delimit .Params.categories ", " }}</p>
      <p>标签：{{ delimit .Params.tags ", " }}</p>
    </div>

    <div class="theme-actions">
      <a href="{{ .Params.demo }}" class="btn-primary" target="_blank">在线演示</a>
      <a href="{{ .Params.github }}" class="btn-secondary" target="_blank">查看源码</a>
    </div>

    <!-- CTA 引导 -->
    <div class="theme-cta">
      <p>需要定制化开发？<a href="/services/">联系我们 →</a></p>
    </div>
  </article>
{{ end }}
