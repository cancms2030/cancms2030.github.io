baseURL = "https://www.cancms.com"
languageCode = "zh-cn"
title = "cancms - 专业静态网站建站服务"
theme = "cancms"
defaultContentLanguage = "zh"

# ========== SEO 核心配置 ==========
enableRobotsTXT = true
enableGitInfo = true

# ========== 永久链接配置 ==========
[permalinks]
  blog = "/blog/:slug/"
  services = "/services/"

# ========== 站点地图配置 ==========
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# ========== 构建优化 ==========
[build]
  writeStats = true
  [build.buildStats]
    enable = true

# ========== 分页配置 ==========
[pagination]
  pagerSize = 10
  path = "page"

# ========== 图片处理配置 ==========
[imaging]
  resampleFilter = "Lanczos"
  quality = 75
  anchor = "smart"
  hint = "photo"

# ========== Markdown 渲染配置 ==========
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "cancms提供专业静态网站建站服务，基于Hugo生成器，速度快、成本低、安全可靠。为企业、个人、学术机构提供一站式静态网站解决方案。"
  keywords = "静态网站,静态网站建站,静态网站生成器,Hugo建站,静态网站开发,企业静态网站,个人网站建设,学术网站建设"
  author = "CANCMS"
  company = "CANCMS"
  address = ""
  phone = ""
  email = "cancms@163.com"
  taobao_shop = "https://item.taobao.com/item.htm?id=767084316219"
  weixin = "ncp2025"

# ========== 统计分析配置 ==========
# Google Analytics 4（请替换为实际 ID）
[services.googleAnalytics]
  id = "G-R68BVLKF44"

# 百度统计
baidu_tongji_id = "633952dd75036da9ccff0812740fb199"

[menus]
  [[menus.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1

  [[menus.main]]
    identifier = "about"
    name = "关于我们"
    url = "/about/"
    weight = 2
 

  [[menus.main]]
    identifier = "services"
    name = "我们的服务"
    url = "/services/"
    weight = 3
  
  [[menus.main]]
    identifier = "portfolio"
    name = "案例展示"
    url = "/portfolio/"
    weight = 4
 
  [[menus.main]]
    identifier = "blog"
    name = "博客"
    url = "/blog/"
    weight = 5

[outputs]
  home = ["HTML", "RSS", "JSON"] 